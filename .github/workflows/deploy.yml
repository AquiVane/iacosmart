name: Deploy COSMART IA

# Disparo manual por ahora, mismo criterio que cosmart-workers: hasta que el
# flujo de login/subida esté probado en la práctica, no se despliega solo en
# cada push. Una vez confirmado, se puede cambiar a "on: push: branches: [main]".
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Cargar SETUP_SECRET en el Worker
        run: echo "${{ secrets.SETUP_SECRET }}" | npx wrangler secret put SETUP_SECRET
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
