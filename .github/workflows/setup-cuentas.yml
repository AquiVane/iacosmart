name: Setup cuentas iniciales
on:
  workflow_dispatch:
    inputs:
      setup_secret:
        description: 'SETUP_SECRET del Worker'
        required: true
        type: string
jobs:
  crear-cuentas:
    runs-on: ubuntu-latest
    steps:
      - name: Crear cuenta Ger
        run: |
          curl -sS -X POST https://iacosmart.conglomeradocosmart.workers.dev/api/setup \
            -H "Content-Type: application/json" \
            -d "{\"secret\":\"${{ inputs.setup_secret }}\",\"nombre\":\"Ger\",\"email\":\"ger@cosmart.com.ar\",\"password\":\"videosconia1\",\"rol\":\"admin\"}"
      - name: Crear cuenta Vaneh
        run: |
          curl -sS -X POST https://iacosmart.conglomeradocosmart.workers.dev/api/setup \
            -H "Content-Type: application/json" \
            -d "{\"secret\":\"${{ inputs.setup_secret }}\",\"nombre\":\"Vaneh\",\"email\":\"vaneh@cosmart.com.ar\",\"password\":\"videosconia2\",\"rol\":\"admin\"}"
